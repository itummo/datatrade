<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trading Light Webview Pro - Strapi Charts</title>
  
  <script src="https://unpkg.com/lightweight-charts@3.8.0/dist/lightweight-charts.standalone.production.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      background-color: #131722; 
      color: #d1d4dc; 
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .navbar {
      background-color: #1e222d;
      border-bottom: 1px solid #2a2e39;
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand { font-size: 15px; font-weight: bold; color: #2962ff; }
    
    .auth-container {
      max-width: 360px;
      margin: auto;
      padding: 24px;
      background: #1e222d;
      border: 1px solid #2a2e39;
      border-radius: 8px;
      width: 90%;
    }
    .auth-container h3 { margin-bottom: 16px; font-size: 18px; text-align: center; color: #fff; }
    .auth-container input {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      background: #131722;
      border: 1px solid #363a45;
      border-radius: 4px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    .auth-container input:focus { border-color: #2962ff; }
    .btn-primary {
      width: 100%;
      padding: 10px;
      background: #2962ff;
      border: none;
      color: white;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-primary:hover { background: #1e54e4; }
    .btn-secondary {
      width: 100%;
      padding: 8px;
      background: transparent;
      border: 1px solid #363a45;
      color: #787b86;
      border-radius: 4px;
      margin-top: 8px;
      cursor: pointer;
      font-size: 13px;
    }
    .btn-secondary:hover { color: #fff; border-color: #787b86; }
    
    .chart-wrapper {
      flex: 1;
      position: relative;
      width: 100%;
      height: 100%;
    }
    #chart-container {
      width: 100%;
      height: 100%;
    }

    .hidden { display: none !important; }
    #msg { margin-top: 10px; font-size: 13px; text-align: center; }
  </style>
</head>
<body>

  <div class="navbar">
    <div class="brand">📈 TRADING LIGHTWEB - STRAPI API</div>
    <div id="user-status" class="hidden">
      <span id="user-display" style="font-size: 13px; color: #787b86; margin-right: 10px;"></span>
      <button onclick="handleSignOut()" style="background:#f44336; border:none; color:#fff; padding:4px 8px; border-radius:4px; cursor:pointer; font-size:12px;">Đăng xuất</button>
    </div>
  </div>

  <div id="auth-screen" class="auth-container">
    <h3 id="auth-title">Đăng Nhập</h3>
    <input type="text" id="username" placeholder="Username (Tên đăng nhập)...">
    <input type="email" id="email" placeholder="Email...">
    <input type="password" id="password" placeholder="Mật khẩu...">
    
    <button id="btn-submit" class="btn-primary" onclick="handleAuth()">Đăng Nhập</button>
    <button class="btn-secondary" onclick="toggleAuthMode()">Chuyển sang Đăng ký / Đăng nhập</button>
    
    <div id="msg"></div>
  </div>

  <div id="dashboard-screen" class="chart-wrapper hidden">
    <div id="chart-container"></div>
  </div>

  <script>
    // 🌐 DOMAIN STRAPI VPS QUA CLOUDFLARE TUNNEL
    const STRAPI_URL = 'https://api.itutrade.online'; 
    
    let isRegisterMode = false;
    let chart = null;

    // 1. Kiểm tra Token khi tải trang
    window.addEventListener('DOMContentLoaded', () => {
      const token = localStorage.getItem('jwt_token');
      const user = JSON.parse(localStorage.getItem('user_info') || '{}');

      if (token && user) {
        showDashboard(user);
      }
    });

    // 2. Chuyển đổi giữa Đăng nhập & Đăng ký
    function toggleAuthMode() {
      isRegisterMode = !isRegisterMode;
      document.getElementById('auth-title').innerText = isRegisterMode ? 'Đăng Ký Tài Khoản' : 'Đăng Nhập';
      document.getElementById('btn-submit').innerText = isRegisterMode ? 'Đăng Ký' : 'Đăng Nhập';
      document.getElementById('msg').innerText = '';
    }

    // 3. Xử lý Gọi API Đăng ký / Đăng nhập từ Strapi
    async function handleAuth() {
      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const msgDiv = document.getElementById('msg');

      msgDiv.style.color = '#2962ff';
      msgDiv.innerText = 'Đang kết nối tới server...';

      // Endpoint tương ứng của Strapi
      const endpoint = isRegisterMode 
        ? `${STRAPI_URL}/api/auth/local/register` 
        : `${STRAPI_URL}/api/auth/local`;

      // Payload gửi lên Strapi
      const payload = isRegisterMode 
        ? { username, email, password }
        : { identifier: email || username, password };

      try {
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error?.message || 'Đăng nhập thất bại. Vui lòng kiểm tra lại!');
        }

        localStorage.setItem('jwt_token', data.jwt);
        localStorage.setItem('user_info', JSON.stringify(data.user));

        msgDiv.style.color = '#4caf50';
        msgDiv.innerText = 'Thành công!';
        
        showDashboard(data.user);

      } catch (err) {
        msgDiv.style.color = '#f44336';
        msgDiv.innerText = err.message;
      }
    }

    // 4. Xử lý Đăng xuất
    function handleSignOut() {
      localStorage.removeItem('jwt_token');
      localStorage.removeItem('user_info');
      document.getElementById('auth-screen').classList.remove('hidden');
      document.getElementById('dashboard-screen').classList.add('hidden');
      document.getElementById('user-status').classList.add('hidden');
    }

    // 5. Hiển thị Dashboard & Gọi hàm render Chart
    function showDashboard(user) {
      document.getElementById('auth-screen').classList.add('hidden');
      document.getElementById('dashboard-screen').classList.remove('hidden');
      document.getElementById('user-status').classList.remove('hidden');
      document.getElementById('user-display').innerText = user.email || user.username;

      renderAdvancedChart('BTCUSDT');
    }

    // 6. Tải dữ liệu Nến từ API future-btcusdt-lastcandle-5ms và vẽ Lightweight Chart
    async function renderAdvancedChart(symbol) {
      const container = document.getElementById('chart-container');
      if (!container) return;

      if (chart) { chart.remove(); chart = null; }

      // Khởi tạo Lightweight Chart
      chart = LightweightCharts.createChart(container, {
        width: container.clientWidth,
        height: container.clientHeight,
        layout: { backgroundColor: '#131722', textColor: '#d1d4dc' },
        grid: { vertLines: { color: '#1f2937' }, horzLines: { color: '#1f2937' } },
        timeScale: { timeVisible: true, secondsVisible: false }
      });

      const candlestickSeries = chart.addCandlestickSeries({
        upColor: '#26a69a', downColor: '#ef5350',
        borderUpColor: '#26a69a', borderDownColor: '#ef5350',
        wickUpColor: '#26a69a', wickDownColor: '#ef5350',
      });

      const token = localStorage.getItem('jwt_token');

      try {
        // Gọi API lấy dữ liệu nến 5 phút
        const res = await fetch(`${STRAPI_URL}/api/future-btcusdt-lastcandle-5ms`, {
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });
        
        const result = await res.json();
        
        if (result.data && Array.isArray(result.data)) {
          const candleData = [];

          result.data.forEach(item => {
            // Dữ liệu từ API có các trường: open_time, open_ashi, high_ashi, low_ashi, close_ashi
            // open_time là timestamp milliseconds
            const timeInSeconds = Math.floor(parseInt(item.open_time) / 1000);

            candleData.push({
              time: timeInSeconds,
              open: parseFloat(item.open_ashi),
              high: parseFloat(item.high_ashi),
              low: parseFloat(item.low_ashi),
              close: parseFloat(item.close_ashi)
            });
          });

          // Sắp xếp dữ liệu theo thời gian tăng dần
          candleData.sort((a, b) => a.time - b.time);

          // Lọc trùng thời gian (nếu có)
          const uniqueCandles = candleData.filter((v, i, a) => 
            a.findIndex(t => t.time === v.time) === i
          );

          // Nạp dữ liệu lên Chart
          candlestickSeries.setData(uniqueCandles);

          chart.timeScale().fitContent();
        } else {
          console.warn('Không có dữ liệu nến từ API');
        }
      } catch (err) {
        console.error('Lỗi khi lấy dữ liệu từ Strapi API:', err);
      }
    }

    // Tự động Responsive Chart khi Resize màn hình
    window.addEventListener('resize', () => {
      const container = document.getElementById('chart-container');
      if (chart && container) {
        chart.applyOptions({ width: container.clientWidth, height: container.clientHeight });
      }
    });
  </script>
</body>
</html>
