<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trading Light Webview Pro - Strapi Charts</title>
  
  <script src="https://unpkg.com/lightweight-charts@3.8.0/dist/lightweight-charts.standalone.production.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      background-color: #131722; 
      color: #d1d4dc; 
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .navbar {
      background-color: #1e222d;
      border-bottom: 1px solid #2a2e39;
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand { font-size: 15px; font-weight: bold; color: #2962ff; }
    
    .auth-container {
      max-width: 360px;
      margin: auto;
      padding: 24px;
      background: #1e222d;
      border: 1px solid #2a2e39;
      border-radius: 8px;
      width: 90%;
    }
    .auth-container h3 { margin-bottom: 16px; font-size: 18px; text-align: center; color: #fff; }
    .auth-container input {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      background: #131722;
      border: 1px solid #363a45;
      border-radius: 4px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    .auth-container input:focus { border-color: #2962ff; }
    .btn-primary {
      width: 100%;
      padding: 10px;
      background: #2962ff;
      border: none;
      color: white;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-primary:hover { background: #1e54e4; }
    .btn-secondary {
      width: 100%;
      padding: 8px;
      background: transparent;
      border: 1px solid #363a45;
      color: #787b86;
      border-radius: 4px;
      margin-top: 8px;
      cursor: pointer;
      font-size: 13px;
    }
    .btn-secondary:hover { color: #fff; border-color: #787b86; }
    
    .chart-wrapper {
      flex: 1;
      position: relative;
      width: 100%;
      height: 100%;
    }
    #chart-container {
      width: 100%;
      height: 100%;
    }

    .hidden { display: none !important; }
    #msg { margin-top: 10px; font-size: 13px; text-align: center; }
    .loading {
      text-align: center;
      padding: 20px;
      color: #787b86;
    }
    .progress-bar {
      width: 100%;
      height: 4px;
      background: #1f2937;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 9999;
    }
    .progress-bar .progress {
      height: 100%;
      background: #2962ff;
      width: 0%;
      transition: width 0.3s;
    }
    .status-bar {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(19, 23, 34, 0.9);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      color: #787b86;
      border: 1px solid #2a2e39;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 10px;
      backdrop-filter: blur(10px);
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }
    .status-dot.live {
      background: #4caf50;
      animation: pulse 2s infinite;
    }
    .status-dot.error {
      background: #ef5350;
    }
    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.3; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="progress-bar" id="progressBar">
    <div class="progress" id="progress"></div>
  </div>

  <div class="navbar">
    <div class="brand">📈 TRADING LIGHTWEB - STRAPI API</div>
    <div id="user-status" class="hidden">
      <span id="user-display" style="font-size: 13px; color: #787b86; margin-right: 10px;"></span>
      <button onclick="handleSignOut()" style="background:#f44336; border:none; color:#fff; padding:4px 8px; border-radius:4px; cursor:pointer; font-size:12px;">Đăng xuất</button>
    </div>
  </div>

  <div id="auth-screen" class="auth-container">
    <h3 id="auth-title">Đăng Nhập</h3>
    <input type="text" id="username" placeholder="Username...">
    <input type="email" id="email" placeholder="Email...">
    <input type="password" id="password" placeholder="Mật khẩu...">
    
    <button id="btn-submit" class="btn-primary" onclick="handleAuth()">Đăng Nhập</button>
    <button class="btn-secondary" onclick="toggleAuthMode()">Chuyển sang Đăng ký</button>
    
    <div id="msg"></div>
  </div>

  <div id="dashboard-screen" class="chart-wrapper hidden">
    <div id="chart-container">
      <div class="loading">Đang tải dữ liệu...</div>
    </div>
  </div>

  <script>
    const STRAPI_URL = 'https://api.itutrade.online'; 
    
    let isRegisterMode = false;
    let chart = null;
    let candlestickSeries = null;
    let autoRefreshInterval = null;
    let allCandleData = [];
    let lastCandleTime = 0;
    let isRefreshing = false;

    // ⏱️ Cấu hình auto-refresh
    const REFRESH_INTERVAL = 30000; // 30 giây (phù hợp với nến 5 phút)
    // const REFRESH_INTERVAL = 60000; // 1 phút
    // const REFRESH_INTERVAL = 300000; // 5 phút

    // ✅ Hàm lấy toàn bộ dữ liệu từ API
    async function fetchAllData(endpoint, token) {
      let allData = [];
      let page = 1;
      const pageSize = 100; // Tăng lên 100 để giảm số lần gọi
      let hasMore = true;
      let totalItems = 0;

      const progress = document.getElementById('progress');
      
      try {
        while (hasMore) {
          const url = `${endpoint}?pagination[page]=${page}&pagination[pageSize]=${pageSize}&sort=open_time:asc`;
          console.log(`📥 Đang tải trang ${page}...`);
          
          const response = await fetch(url, {
            headers: {
              'Authorization': `Bearer ${token}`,
              'Content-Type': 'application/json'
            }
          });

          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }

          const result = await response.json();
          
          if (page === 1 && result.meta?.pagination?.total) {
            totalItems = result.meta.pagination.total;
            console.log(`📊 Tổng số bản ghi: ${totalItems}`);
          }

          if (result.data && Array.isArray(result.data)) {
            allData = allData.concat(result.data);
            console.log(`✅ Trang ${page}: đã lấy ${result.data.length} bản ghi (tổng: ${allData.length})`);
          }

          if (result.meta?.pagination?.pageCount) {
            const totalPages = result.meta.pagination.pageCount;
            hasMore = page < totalPages;
            page++;
            
            const progressPercent = (allData.length / totalItems) * 100;
            progress.style.width = `${Math.min(progressPercent, 100)}%`;
          } else {
            hasMore = false;
          }
        }

        progress.style.width = '100%';
        setTimeout(() => {
          progress.style.width = '0%';
        }, 500);

        console.log(`🎯 Hoàn thành! Tổng cộng ${allData.length} bản ghi`);
        return allData;

      } catch (error) {
        console.error('❌ Lỗi khi tải dữ liệu:', error);
        throw error;
      }
    }

    // 🎨 Vẽ chart
    function drawChart(container, data) {
      if (chart) {
        chart.remove();
        chart = null;
      }

      chart = LightweightCharts.createChart(container, {
        width: container.clientWidth,
        height: container.clientHeight,
        layout: { 
          backgroundColor: '#131722', 
          textColor: '#d1d4dc' 
        },
        grid: { 
          vertLines: { color: '#1f2937' }, 
          horzLines: { color: '#1f2937' } 
        },
        timeScale: { 
          timeVisible: true, 
          secondsVisible: false,
          borderColor: '#2a2e39'
        },
        rightPriceScale: {
          borderColor: '#2a2e39'
        }
      });

      candlestickSeries = chart.addCandlestickSeries({
        upColor: '#26a69a', 
        downColor: '#ef5350',
        borderUpColor: '#26a69a', 
        borderDownColor: '#ef5350',
        wickUpColor: '#26a69a', 
        wickDownColor: '#ef5350',
      });

      candlestickSeries.setData(data);
      chart.timeScale().fitContent();

      // Thêm status bar
      updateStatusBar('live', `${data.length} nến • Cập nhật: ${new Date().toLocaleTimeString()}`);
    }

    // 📊 Cập nhật dữ liệu mới (chỉ lấy nến mới nhất)
    async function fetchNewCandles(token, lastTime) {
      try {
        // Chỉ lấy dữ liệu mới hơn lastTime
        const url = `${STRAPI_URL}/api/future-btcusdt-lastcandle-5ms?sort=open_time:desc&pagination[page]=1&pagination[pageSize]=10`;
        
        const response = await fetch(url, {
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          }
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const result = await response.json();
        
        if (!result.data || !Array.isArray(result.data)) {
          return [];
        }

        // Lọc những nến mới hơn lastTime
        const newCandles = result.data.filter(item => {
          const time = Math.floor(parseInt(item.open_time) / 1000);
          return time > lastTime;
        });

        // Sắp xếp tăng dần theo thời gian
        newCandles.sort((a, b) => parseInt(a.open_time) - parseInt(b.open_time));

        console.log(`🆕 Phát hiện ${newCandles.length} nến mới`);
        return newCandles;

      } catch (error) {
        console.error('❌ Lỗi khi lấy nến mới:', error);
        return [];
      }
    }

    // 🔄 Cập nhật chart với dữ liệu mới
    async function updateChartWithNewData() {
      if (isRefreshing) return;
      isRefreshing = true;

      try {
        const token = localStorage.getItem('jwt_token');
        if (!token) {
          stopAutoRefresh();
          return;
        }

        const newCandles = await fetchNewCandles(token, lastCandleTime);
        
        if (newCandles.length > 0) {
          // Chuyển đổi dữ liệu mới
          const newCandleData = newCandles.map(item => ({
            time: Math.floor(parseInt(item.open_time) / 1000),
            open: parseFloat(item.open_ashi),
            high: parseFloat(item.high_ashi),
            low: parseFloat(item.low_ashi),
            close: parseFloat(item.close_ashi)
          }));

          // Cập nhật dữ liệu
          allCandleData = allCandleData.concat(newCandleData);
          
          // Cập nhật lastTime
          if (newCandleData.length > 0) {
            lastCandleTime = newCandleData[newCandleData.length - 1].time;
          }

          // Cập nhật chart
          if (candlestickSeries) {
            candlestickSeries.setData(allCandleData);
            chart.timeScale().fitContent();
            
            // Cập nhật status
            updateStatusBar('live', `${allCandleData.length} nến • Cập nhật: ${new Date().toLocaleTimeString()}`);
            console.log(`✅ Đã cập nhật chart với ${newCandleData.length} nến mới`);
          }
        } else {
          // Không có dữ liệu mới
          updateStatusBar('live', `${allCandleData.length} nến • Không có dữ liệu mới • ${new Date().toLocaleTimeString()}`);
        }

      } catch (error) {
        console.error('❌ Lỗi cập nhật:', error);
        updateStatusBar('error', 'Lỗi kết nối');
      } finally {
        isRefreshing = false;
      }
    }

    // 📊 Cập nhật status bar
    function updateStatusBar(status, text) {
      const container = document.getElementById('chart-container');
      let statusBar = container.querySelector('.status-bar');
      
      if (!statusBar) {
        statusBar = document.createElement('div');
        statusBar.className = 'status-bar';
        container.appendChild(statusBar);
      }

      const dotClass = status === 'live' ? 'live' : 'error';
      statusBar.innerHTML = `
        <span class="status-dot ${dotClass}"></span>
        <span>${text}</span>
        ${status === 'live' ? '<span style="font-size:10px;opacity:0.5;">● Live</span>' : ''}
      `;
    }

    // ⏹️ Dừng auto-refresh
    function stopAutoRefresh() {
      if (autoRefreshInterval) {
        clearInterval(autoRefreshInterval);
        autoRefreshInterval = null;
        console.log('⏹️ Đã dừng auto-refresh');
      }
    }

    // ▶️ Bắt đầu auto-refresh
    function startAutoRefresh() {
      stopAutoRefresh();
      autoRefreshInterval = setInterval(updateChartWithNewData, REFRESH_INTERVAL);
      console.log(`▶️ Bắt đầu auto-refresh mỗi ${REFRESH_INTERVAL/1000} giây`);
    }

    // ============ PHẦN CHÍNH ============
    window.addEventListener('DOMContentLoaded', () => {
      const token = localStorage.getItem('jwt_token');
      const user = JSON.parse(localStorage.getItem('user_info') || '{}');

      if (token && user) {
        showDashboard(user);
      }
    });

    function toggleAuthMode() {
      isRegisterMode = !isRegisterMode;
      document.getElementById('auth-title').innerText = isRegisterMode ? 'Đăng Ký' : 'Đăng Nhập';
      document.getElementById('btn-submit').innerText = isRegisterMode ? 'Đăng Ký' : 'Đăng Nhập';
      document.getElementById('msg').innerText = '';
    }

    async function handleAuth() {
      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const msgDiv = document.getElementById('msg');

      msgDiv.style.color = '#2962ff';
      msgDiv.innerText = 'Đang kết nối...';

      const endpoint = isRegisterMode 
        ? `${STRAPI_URL}/api/auth/local/register` 
        : `${STRAPI_URL}/api/auth/local`;

      const payload = isRegisterMode 
        ? { username, email, password }
        : { identifier: email || username, password };

      try {
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error?.message || 'Đăng nhập thất bại!');
        }

        localStorage.setItem('jwt_token', data.jwt);
        localStorage.setItem('user_info', JSON.stringify(data.user));

        msgDiv.style.color = '#4caf50';
        msgDiv.innerText = 'Thành công!';
        
        showDashboard(data.user);

      } catch (err) {
        msgDiv.style.color = '#f44336';
        msgDiv.innerText = err.message;
      }
    }

    function handleSignOut() {
      stopAutoRefresh();
      localStorage.removeItem('jwt_token');
      localStorage.removeItem('user_info');
      document.getElementById('auth-screen').classList.remove('hidden');
      document.getElementById('dashboard-screen').classList.add('hidden');
      document.getElementById('user-status').classList.add('hidden');
    }

    function showDashboard(user) {
      document.getElementById('auth-screen').classList.add('hidden');
      document.getElementById('dashboard-screen').classList.remove('hidden');
      document.getElementById('user-status').classList.remove('hidden');
      document.getElementById('user-display').innerText = user.email || user.username;

      renderAdvancedChart();
    }

    async function renderAdvancedChart() {
      const container = document.getElementById('chart-container');
      if (!container) return;

      container.innerHTML = '<div class="loading">Đang tải dữ liệu nến...</div>';

      stopAutoRefresh();

      try {
        const token = localStorage.getItem('jwt_token');
        
        if (!token) {
          throw new Error('Vui lòng đăng nhập lại');
        }

        // Lấy toàn bộ dữ liệu
        const endpoint = `${STRAPI_URL}/api/future-btcusdt-lastcandle-5ms`;
        const rawData = await fetchAllData(endpoint, token);

        if (!rawData || rawData.length === 0) {
          throw new Error('Không có dữ liệu nến');
        }

        container.innerHTML = '';

        // Chuyển đổi dữ liệu
        allCandleData = rawData.map(item => ({
          time: Math.floor(parseInt(item.open_time) / 1000),
          open: parseFloat(item.open_ashi),
          high: parseFloat(item.high_ashi),
          low: parseFloat(item.low_ashi),
          close: parseFloat(item.close_ashi)
        }));

        allCandleData.sort((a, b) => a.time - b.time);

        // Lưu thời gian của nến cuối cùng
        lastCandleTime = allCandleData[allCandleData.length - 1].time;

        console.log(`✅ Đã xử lý ${allCandleData.length} nến`);
        console.log(`📅 Nến cuối cùng: ${new Date(lastCandleTime * 1000).toLocaleString()}`);

        // Vẽ chart
        drawChart(container, allCandleData);

        // Bắt đầu auto-refresh
        startAutoRefresh();

      } catch (err) {
        console.error('❌ Lỗi:', err);
        container.innerHTML = `<div class="loading" style="color: #ef5350;">❌ ${err.message}</div>`;
      }
    }

    // Resize handler
    window.addEventListener('resize', () => {
      const container = document.getElementById('chart-container');
      if (chart && container && !container.innerHTML.includes('loading')) {
        try {
          chart.applyOptions({ 
            width: container.clientWidth, 
            height: container.clientHeight 
          });
        } catch (e) {
          console.warn('Resize error:', e);
        }
      }
    });

    // Reload chart
    window.reloadChart = function() {
      renderAdvancedChart();
    };

    // Cleanup khi đóng tab
    window.addEventListener('beforeunload', () => {
      stopAutoRefresh();
    });
  </script>
</body>
</html>
