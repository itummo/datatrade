<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supabase Auth Demo</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: Arial, sans-serif; max-width: 400px; margin: 50px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
    input { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 5px; }
    button:hover { background-color: #0056b3; }
    .btn-secondary { background-color: #6c757d; }
    .hidden { display: none; }
    #msg { margin-top: 15px; color: red; font-weight: bold; word-break: break-all; }
  </style>
</head>
<body>

  <h2>Trading Light Webview - Auth</h2>

  <div id="auth-form">
    <input type="email" id="email" placeholder="Nhập Email của bạn..." required />
    <input type="password" id="password" placeholder="Nhập Mật khẩu..." required />
    
    <button onclick="handleSignUp()">Đăng ký tài khoản</button>
    <button onclick="handleSignIn()" class="btn-secondary">Đăng nhập</button>
  </div>

  <div id="user-dashboard" class="hidden">
    <h3>Xin chào, <span id="user-email" style="color: green;"></span>!</h3>
    <p>Status: <b>Đã xác thực thành công qua Supabase</b></p>
    <button onclick="handleSignOut()" style="background-color: #dc3545;">Đăng xuất</button>
  </div>

  <div id="msg"></div>

  <script>
    // ⚠️ 1. THAY THẾ BẰNG THÔNG TIN SUPABASE CỦA BẠN 
    const SUPABASE_URL = 'https://tezauanmyuxugsprdegg.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_HaqgO14NHvqy0cWbiI1RzA_KKOPKiXZ'; // Dùng Public Anon Key, KHÔNG dùng Service Role Key!

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // DOM Elements
    const authForm = document.getElementById('auth-form');
    const userDashboard = document.getElementById('user-dashboard');
    const userEmailSpan = document.getElementById('user-email');
    const msgDiv = document.getElementById('msg');

    // KÍCH HOẠT THEO DÕI TRẠNG THÁI TÀI KHOẢN (Auto Check Session)
    supabaseClient.auth.onAuthStateChange((event, session) => {
      if (session) {
        // Đã đăng nhập
        authForm.classList.add('hidden');
        userDashboard.classList.remove('hidden');
        userEmailSpan.innerText = session.user.email;
        msgDiv.style.color = 'green';
        msgDiv.innerText = 'Đã đăng nhập với tư cách: ' + session.user.email;
      } else {
        // Chưa đăng nhập / Đã logout
        authForm.classList.remove('hidden');
        userDashboard.classList.add('hidden');
        msgDiv.innerText = '';
      }
    });

    // 1. Xử lý Đăng ký (Register)
    async function handleSignUp() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      msgDiv.style.color = 'blue';
      msgDiv.innerText = 'Đang xử lý đăng ký...';

      const { data, error } = await supabaseClient.auth.signUp({ email, password });

      if (error) {
        msgDiv.style.color = 'red';
        msgDiv.innerText = 'Lỗi: ' + error.message;
      } else {
        msgDiv.style.color = 'green';
        msgDiv.innerText = 'Đăng ký thành công! Hãy kiểm tra Email để kích hoạt (nếu Supabase bật Require Email Confirmation).';
      }
    }

    // 2. Xử lý Đăng nhập (Login)
    async function handleSignIn() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      msgDiv.style.color = 'blue';
      msgDiv.innerText = 'Đang đăng nhập...';

      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

      if (error) {
        msgDiv.style.color = 'red';
        msgDiv.innerText = 'Đăng nhập thất bại: ' + error.message;
      }
    }

    // 3. Xử lý Đăng xuất (Logout)
    async function handleSignOut() {
      await supabaseClient.auth.signOut();
      msgDiv.style.color = 'black';
      msgDiv.innerText = 'Đã đăng xuất thành công.';
    }
  </script>
</body>
</html>
