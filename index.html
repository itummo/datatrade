<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trading Light Webview Pro - OHLC & Peak Markers</title>
  
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Lightweight Charts v3.8.0 -->
  <script src="https://unpkg.com/lightweight-charts@3.8.0/dist/lightweight-charts.standalone.production.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      background-color: #131722; 
      color: #d1d4dc; 
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .navbar {
      background-color: #1e222d;
      border-bottom: 1px solid #2a2e39;
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand { font-size: 15px; font-weight: bold; color: #2962ff; }
    .auth-container {
      max-width: 360px;
      margin: auto;
      padding: 24px;
      background: #1e222d;
      border: 1px solid #2a2e39;
      border-radius: 8px;
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      background: #131722;
      border: 1px solid #363a45;
      border-radius: 4px;
      color: #fff;
    }
    button.btn-primary {
      width: 100%;
      padding: 10px;
      background: #2962ff;
      border: none;
      color: white;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }
    .chart-wrapper {
      flex: 1;
      position: relative;
      width: 100%;
      height: 100%;
    }
    #chart-container { width: 100%; height: 100%; }
    .hidden { display: none !important; }
    #msg { color: #f44336; font-size: 13px; margin-top: 8px; text-align: center; }
  </style>
</head>
<body>

  <div class="navbar">
    <div class="brand">📈 TRADING LIGHT - ZIGZAG PEAKS & OHLC</div>
    <div id="user-status" class="hidden">
      <span id="user-email" style="font-size: 13px; color: #787b86; margin-right: 10px;"></span>
      <button onclick="handleSignOut()" style="background:#f44336; border:none; color:#fff; padding:4px 8px; border-radius:4px; cursor:pointer;">Đăng xuất</button>
    </div>
  </div>

  <!-- Form Login -->
  <div id="auth-screen" class="auth-container">
    <h3 style="margin-bottom: 12px; text-align: center;">Đăng Nhập</h3>
    <input type="email" id="email" placeholder="Email...">
    <input type="password" id="password" placeholder="Mật khẩu...">
    <button class="btn-primary" onclick="handleSignIn()">Đăng Nhập</button>
    <div id="msg"></div>
  </div>

  <!-- Screen chứa Chart -->
  <div id="dashboard-screen" class="chart-wrapper hidden">
    <div id="chart-container"></div>
  </div>

  <script>
    // ⚙️ CẤU HÌNH SUPABASE
    const SUPABASE_URL = 'https://tezauanmyuxugsprdegg.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_HaqgO14NHvqy0cWbiI1RzA_KKOPKiXZ';
 const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let chart = null;
    let candlestickSeries = null;
    let zigzagLineSeries = null;

    // THEO DÕI LOGGED IN
    supabaseClient.auth.onAuthStateChange((event, session) => {
      const authScreen = document.getElementById('auth-screen');
      const dashboardScreen = document.getElementById('dashboard-screen');
      const userStatus = document.getElementById('user-status');
      const userEmail = document.getElementById('user-email');

      if (session) {
        authScreen.classList.add('hidden');
        dashboardScreen.classList.remove('hidden');
        userStatus.classList.remove('hidden');
        userEmail.innerText = session.user.email;
        
        setTimeout(() => renderAdvancedChart('BTCUSDT'), 150);
      } else {
        authScreen.classList.remove('hidden');
        dashboardScreen.classList.add('hidden');
        userStatus.classList.add('hidden');
      }
    });

    async function handleSignIn() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const msgDiv = document.getElementById('msg');
      msgDiv.innerText = 'Đang xác thực...';

      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) msgDiv.innerText = 'Lỗi: ' + error.message;
    }

    async function handleSignOut() {
      await supabaseClient.auth.signOut();
    }

    // 🚀 HÀM VẼ OHLC + ZIGZAG LINE + PEAK MARKERS
    async function renderAdvancedChart(symbol) {
      const container = document.getElementById('chart-container');
      if (!container) return;

      if (chart) {
        chart.remove();
        chart = null;
      }

      // 1. Tạo Khung Chart Dark Theme
      chart = LightweightCharts.createChart(container, {
        width: container.clientWidth,
        height: container.clientHeight,
        layout: { backgroundColor: '#131722', textColor: '#d1d4dc' },
        grid: { vertLines: { color: '#1f2937' }, horzLines: { color: '#1f2937' } },
        crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
        timeScale: { timeVisible: true, secondsVisible: false, borderColor: '#2a2e39' },
        rightPriceScale: { borderColor: '#2a2e39' }
      });

      // 2. Lớp Layer 1: Nến Candlestick (OHLC)
      candlestickSeries = chart.addCandlestickSeries({
        upColor: '#26a69a',
        downColor: '#ef5350',
        borderVisible: false,
        wickUpColor: '#26a69a',
        wickDownColor: '#ef5350',
      });

      // 3. Lớp Layer 2: Đường Zigzag Nối Đỉnh Đáy
      zigzagLineSeries = chart.addLineSeries({
        color: '#f0b90b', // Màu vàng
        lineWidth: 2,
        crosshairMarkerVisible: false,
      });

      // 4. Lấy dữ liệu từ Supabase
      const { data, error } = await supabaseClient
        .from('zigzag_data')
        .select('*')
        .eq('symbol', symbol)
        .order('time', { ascending: true });

      if (error || !data || data.length === 0) {
        console.warn('Chưa có dữ liệu zigzag_data');
        return;
      }

      // Xử lý dữ liệu
      const candleData = [];
      const zigzagData = [];
      const markers = [];

      data.forEach((item, index) => {
        const timeInSeconds = Math.floor(new Date(item.time).getTime() / 1000);
        const val = parseFloat(item.value);

        // Tạo Nến Giả Lập (Mẫu) xung quanh giá Zigzag để xem nến OHLC
        // (Nếu DB bạn có sẵn open, high, low, close thì thay vào đây)
        const openPrice = index > 0 ? parseFloat(data[index - 1].value) : val * 0.99;
        const closePrice = val;
        const highPrice = Math.max(openPrice, closePrice) + (val * 0.002);
        const lowPrice = Math.min(openPrice, closePrice) - (val * 0.002);

        candleData.push({
          time: timeInSeconds,
          open: openPrice,
          high: highPrice,
          low: lowPrice,
          close: closePrice
        });

        // Dữ liệu cho Đường Zigzag
        zigzagData.push({
          time: timeInSeconds,
          value: val
        });

        // 5. Mũi tên & Note tại điểm PEAK / BOTTOM
        if (item.is_peak === true) {
          markers.push({
            time: timeInSeconds,
            position: 'aboveBar',
            color: '#ef5350', // Đỏ cho Đỉnh (Peak)
            shape: 'arrowDown',
            text: `PEAK: ${val.toLocaleString()}`
          });
        } else if (item.is_peak === false) {
          markers.push({
            time: timeInSeconds,
            position: 'belowBar',
            color: '#26a69a', // Xanh cho Đáy (Bottom)
            shape: 'arrowUp',
            text: `BOTTOM: ${val.toLocaleString()}`
          });
        }
      });

      // Lọc trùng thời gian
      const uniqueCandles = candleData.filter((v, i, a) => a.findIndex(t => t.time === v.time) === i);
      const uniqueZigzag = zigzagData.filter((v, i, a) => a.findIndex(t => t.time === v.time) === i);
      const uniqueMarkers = markers.filter((v, i, a) => a.findIndex(t => t.time === v.time) === i);

      // Đưa Dữ Liệu Lên Chart
      candlestickSeries.setData(uniqueCandles);
      zigzagLineSeries.setData(uniqueZigzag);
      
      // Đánh dấu Mũi tên & Ghi chú Note lên Nến
      candlestickSeries.setMarkers(uniqueMarkers);

      chart.timeScale().fitContent();
    }

    // Responsive Chart
    window.addEventListener('resize', () => {
      const container = document.getElementById('chart-container');
      if (chart && container) {
        chart.resize(container.clientWidth, container.clientHeight);
      }
    });
  </script>
</body>
</html>
