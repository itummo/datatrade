<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trading Light Webview Pro - Strapi Charts</title>
  
  <script src="https://unpkg.com/lightweight-charts@3.8.0/dist/lightweight-charts.standalone.production.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      background-color: #131722; 
      color: #d1d4dc; 
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .navbar {
      background-color: #1e222d;
      border-bottom: 1px solid #2a2e39;
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand { font-size: 15px; font-weight: bold; color: #2962ff; }
    
    .auth-container {
      max-width: 360px;
      margin: auto;
      padding: 24px;
      background: #1e222d;
      border: 1px solid #2a2e39;
      border-radius: 8px;
      width: 90%;
    }
    .auth-container h3 { margin-bottom: 16px; font-size: 18px; text-align: center; color: #fff; }
    .auth-container input {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      background: #131722;
      border: 1px solid #363a45;
      border-radius: 4px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    .auth-container input:focus { border-color: #2962ff; }
    .btn-primary {
      width: 100%;
      padding: 10px;
      background: #2962ff;
      border: none;
      color: white;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-primary:hover { background: #1e54e4; }
    .btn-secondary {
      width: 100%;
      padding: 8px;
      background: transparent;
      border: 1px solid #363a45;
      color: #787b86;
      border-radius: 4px;
      margin-top: 8px;
      cursor: pointer;
      font-size: 13px;
    }
    .btn-secondary:hover { color: #fff; border-color: #787b86; }
    
    .chart-wrapper {
      flex: 1;
      position: relative;
      width: 100%;
      height: 100%;
    }
    #chart-container {
      width: 100%;
      height: 100%;
    }

    .hidden { display: none !important; }
    #msg { margin-top: 10px; font-size: 13px; text-align: center; }
    .loading {
      text-align: center;
      padding: 20px;
      color: #787b86;
    }
  </style>
</head>
<body>

  <div class="navbar">
    <div class="brand">📈 TRADING LIGHTWEB - STRAPI API</div>
    <div id="user-status" class="hidden">
      <span id="user-display" style="font-size: 13px; color: #787b86; margin-right: 10px;"></span>
      <button onclick="handleSignOut()" style="background:#f44336; border:none; color:#fff; padding:4px 8px; border-radius:4px; cursor:pointer; font-size:12px;">Đăng xuất</button>
    </div>
  </div>

  <div id="auth-screen" class="auth-container">
    <h3 id="auth-title">Đăng Nhập</h3>
    <input type="text" id="username" placeholder="Username...">
    <input type="email" id="email" placeholder="Email...">
    <input type="password" id="password" placeholder="Mật khẩu...">
    
    <button id="btn-submit" class="btn-primary" onclick="handleAuth()">Đăng Nhập</button>
    <button class="btn-secondary" onclick="toggleAuthMode()">Chuyển sang Đăng ký</button>
    
    <div id="msg"></div>
  </div>

  <div id="dashboard-screen" class="chart-wrapper hidden">
    <div id="chart-container">
      <div class="loading">Đang tải dữ liệu...</div>
    </div>
  </div>

  <script>
    const STRAPI_URL = 'https://api.itutrade.online'; 
    
    // 🔐 KHÔNG lưu token trong code - lấy từ localStorage sau khi login
    let isRegisterMode = false;
    let chart = null;
    let lastRequestTime = 0;
    let requestCount = 0;

    // ✅ Rate limiting client-side
    function canMakeRequest() {
      const now = Date.now();
      // Reset count sau 1 phút
      if (now - lastRequestTime > 60000) {
        requestCount = 0;
        lastRequestTime = now;
      }
      
      // Giới hạn 10 requests/phút
      if (requestCount >= 10) {
        return false;
      }
      
      requestCount++;
      return true;
    }

    window.addEventListener('DOMContentLoaded', () => {
      const token = localStorage.getItem('jwt_token');
      const user = JSON.parse(localStorage.getItem('user_info') || '{}');

      if (token && user) {
        showDashboard(user);
      }
    });

    function toggleAuthMode() {
      isRegisterMode = !isRegisterMode;
      document.getElementById('auth-title').innerText = isRegisterMode ? 'Đăng Ký' : 'Đăng Nhập';
      document.getElementById('btn-submit').innerText = isRegisterMode ? 'Đăng Ký' : 'Đăng Nhập';
      document.getElementById('msg').innerText = '';
    }

    async function handleAuth() {
      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const msgDiv = document.getElementById('msg');

      msgDiv.style.color = '#2962ff';
      msgDiv.innerText = 'Đang kết nối...';

      const endpoint = isRegisterMode 
        ? `${STRAPI_URL}/api/auth/local/register` 
        : `${STRAPI_URL}/api/auth/local`;

      const payload = isRegisterMode 
        ? { username, email, password }
        : { identifier: email || username, password };

      try {
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error?.message || 'Đăng nhập thất bại!');
        }

        // ✅ Lưu JWT vào localStorage (chỉ user mới biết)
        localStorage.setItem('jwt_token', data.jwt);
        localStorage.setItem('user_info', JSON.stringify(data.user));

        msgDiv.style.color = '#4caf50';
        msgDiv.innerText = 'Thành công!';
        
        showDashboard(data.user);

      } catch (err) {
        msgDiv.style.color = '#f44336';
        msgDiv.innerText = err.message;
      }
    }

    function handleSignOut() {
      localStorage.removeItem('jwt_token');
      localStorage.removeItem('user_info');
      document.getElementById('auth-screen').classList.remove('hidden');
      document.getElementById('dashboard-screen').classList.add('hidden');
      document.getElementById('user-status').classList.add('hidden');
    }

    function showDashboard(user) {
      document.getElementById('auth-screen').classList.add('hidden');
      document.getElementById('dashboard-screen').classList.remove('hidden');
      document.getElementById('user-status').classList.remove('hidden');
      document.getElementById('user-display').innerText = user.email || user.username;

      renderAdvancedChart();
    }

    async function renderAdvancedChart() {
      // ✅ Kiểm tra rate limit
      if (!canMakeRequest()) {
        const container = document.getElementById('chart-container');
        container.innerHTML = '<div class="loading" style="color: #ff9800;">⏳ Quá nhiều yêu cầu, vui lòng đợi 1 phút</div>';
        return;
      }

      const container = document.getElementById('chart-container');
      if (!container) return;

      container.innerHTML = '<div class="loading">Đang tải dữ liệu...</div>';

      if (chart) { 
        chart.remove(); 
        chart = null; 
      }

      try {
        // ✅ Lấy JWT từ localStorage - KHÔNG hardcode
        const token = localStorage.getItem('jwt_token');
        
        if (!token) {
          throw new Error('Vui lòng đăng nhập lại');
        }

        // ✅ Gọi API với JWT của user
        const res = await fetch(`${STRAPI_URL}/api/future-btcusdt-lastcandle-5ms`, {
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          }
        });
        
        console.log('🔍 Response status:', res.status);
        
        if (res.status === 403) {
          throw new Error('❌ Không có quyền truy cập. Vui lòng liên hệ admin để cấp quyền.');
        }
        
        if (res.status === 401) {
          // Token hết hạn
          localStorage.removeItem('jwt_token');
          throw new Error('⏰ Phiên đăng nhập đã hết hạn. Vui lòng đăng nhập lại.');
        }
        
        if (!res.ok) {
          const errorData = await res.json();
          console.error('Error response:', errorData);
          throw new Error(`HTTP ${res.status}: ${errorData.error?.message || 'Lỗi không xác định'}`);
        }
        
        const result = await res.json();
        console.log('📊 Dữ liệu nhận được:', result);
        
        if (!result.data || !Array.isArray(result.data) || result.data.length === 0) {
          throw new Error('Không có dữ liệu nến');
        }

        container.innerHTML = '';

        // ✅ Khởi tạo Chart
        chart = LightweightCharts.createChart(container, {
          width: container.clientWidth,
          height: container.clientHeight,
          layout: { 
            backgroundColor: '#131722', 
            textColor: '#d1d4dc' 
          },
          grid: { 
            vertLines: { color: '#1f2937' }, 
            horzLines: { color: '#1f2937' } 
          },
          timeScale: { 
            timeVisible: true, 
            secondsVisible: false,
            borderColor: '#2a2e39'
          },
          rightPriceScale: {
            borderColor: '#2a2e39'
          }
        });

        const candlestickSeries = chart.addCandlestickSeries({
          upColor: '#26a69a', 
          downColor: '#ef5350',
          borderUpColor: '#26a69a', 
          borderDownColor: '#ef5350',
          wickUpColor: '#26a69a', 
          wickDownColor: '#ef5350',
        });

        // ✅ Xử lý dữ liệu
        const candleData = result.data.map(item => {
          const timeInSeconds = Math.floor(parseInt(item.open_time) / 1000);
          
          return {
            time: timeInSeconds,
            open: parseFloat(item.open_ashi),
            high: parseFloat(item.high_ashi),
            low: parseFloat(item.low_ashi),
            close: parseFloat(item.close_ashi)
          };
        });

        candleData.sort((a, b) => a.time - b.time);

        console.log(`✅ Đã xử lý ${candleData.length} nến`);
        candlestickSeries.setData(candleData);
        chart.timeScale().fitContent();

      } catch (err) {
        console.error('❌ Lỗi:', err);
        container.innerHTML = `<div class="loading" style="color: #ef5350;">❌ ${err.message}</div>`;
      }
    }

    // ✅ Resize handler
    window.addEventListener('resize', () => {
      const container = document.getElementById('chart-container');
      if (chart && container && !container.innerHTML.includes('loading')) {
        try {
          chart.applyOptions({ 
            width: container.clientWidth, 
            height: container.clientHeight 
          });
        } catch (e) {
          console.warn('Resize error:', e);
        }
      }
    });

    // ✅ Reload chart function
    window.reloadChart = function() {
      renderAdvancedChart();
    };
  </script>
</body>
</html>
