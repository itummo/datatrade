<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trading Light Webview - Dashboard</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>

  <style>
    body { font-family: Arial, sans-serif; max-width: 900px; margin: 20px auto; padding: 20px; }
    .card { border: 1px solid #ccc; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
    input { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 5px; }
    button:hover { background-color: #0056b3; }
    .btn-secondary { background-color: #6c757d; }
    .hidden { display: none; }
    #msg { margin-top: 15px; color: red; font-weight: bold; }
    
    /* Khung chứa Biểu đồ TradingView */
    #chart-container {
      width: 100%;
      height: 450px;
      margin-top: 15px;
      border: 1px solid #ddd;
      border-radius: 6px;
      position: relative;
    }
    .header-dashboard {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>
</head>
<body>

  <h2>Trading Light Webview</h2>

  <div id="auth-form" class="card" style="max-width: 400px; margin: 0 auto;">
    <h3>Đăng nhập hệ thống</h3>
    <input type="email" id="email" placeholder="Nhập Email..." required />
    <input type="password" id="password" placeholder="Nhập Mật khẩu..." required />
    
    <button onclick="handleSignIn()">Đăng nhập</button>
    <button onclick="handleSignUp()" class="btn-secondary">Đăng ký mới</button>
  </div>

  <div id="user-dashboard" class="hidden">
    <div class="card">
      <div class="header-dashboard">
        <div>
          <span>Xin chào: <b id="user-email" style="color: green;"></b></span>
        </div>
        <button onclick="handleSignOut()" style="background-color: #dc3545; width: auto; padding: 8px 16px;">Đăng xuất</button>
      </div>
    </div>

    <div class="card">
      <h3>📈 Biểu đồ Zigzag (Symbol: BTCUSDT)</h3>
      <div id="chart-container"></div>
    </div>
  </div>

  <div id="msg"></div>

  <script>
    // ⚠️ ĐIỀN THÔNG TIN SUPABASE CỦA BẠN VÀO ĐÂY
    const SUPABASE_URL = 'https://YOUR_PROJECT_ID.supabase.co';
    const SUPABASE_KEY = 'YOUR_ANON_PUBLIC_KEY';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // DOM Elements
    const authForm = document.getElementById('auth-form');
    const userDashboard = document.getElementById('user-dashboard');
    const userEmailSpan = document.getElementById('user-email');
    const msgDiv = document.getElementById('msg');
    
    let chart = null;
    let lineSeries = null;

    // THEO DÕI TRẠNG THÁI ĐĂNG NHẬP
    supabaseClient.auth.onAuthStateChange((event, session) => {
      if (session) {
        authForm.classList.add('hidden');
        userDashboard.classList.remove('hidden');
        userEmailSpan.innerText = session.user.email;
        msgDiv.innerText = '';
        
        // Tự động tải dữ liệu & vẽ chart khi đã đăng nhập
        loadZigzagChart('BTCUSDT');
      } else {
        authForm.classList.remove('hidden');
        userDashboard.classList.add('hidden');
        msgDiv.innerText = '';
      }
    });

    // 1. ĐĂNG NHẬP / ĐĂNG KÝ / ĐĂNG XUẤT
    async function handleSignIn() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      msgDiv.style.color = 'blue';
      msgDiv.innerText = 'Đang xác thực...';

      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) {
        msgDiv.style.color = 'red';
        msgDiv.innerText = 'Đăng nhập thất bại: ' + error.message;
      }
    }

    async function handleSignUp() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const { error } = await supabaseClient.auth.signUp({ email, password });
      if (error) {
        msgDiv.style.color = 'red';
        msgDiv.innerText = 'Lỗi đăng ký: ' + error.message;
      } else {
        msgDiv.style.color = 'green';
        msgDiv.innerText = 'Đăng ký thành công! Đang đăng nhập...';
      }
    }

    async function handleSignOut() {
      await supabaseClient.auth.signOut();
    }

    // 2. TẢI DỮ LIỆU ZIGZAG TỪ SUPABASE & VẼ BIỂU ĐỒ
    async function loadZigzagChart(symbol = 'BTCUSDT') {
      const container = document.getElementById('chart-container');
      
      // Xóa chart cũ nếu có
      if (!chart) {
        chart = LightweightCharts.createChart(container, {
          layout: { backgroundColor: '#ffffff', textColor: '#333' },
          grid: { vertLines: { color: '#eee' }, horzLines: { color: '#eee' } },
          timeScale: { timeVisible: true, secondsVisible: false }
        });
        
        // Đường Zigzag
        lineSeries = chart.addLineSeries({
          color: '#2962FF',
          lineWidth: 2,
        });
      }

      // Tải dữ liệu từ Supabase (Sắp xếp theo thời gian tăng dần)
      const { data, error } = await supabaseClient
        .from('zigzag_data')
        .select('time, value, is_peak')
        .eq('symbol', symbol)
        .order('time', { ascending: true });

      if (error) {
        console.error('Lỗi lấy dữ liệu:', error);
        return;
      }

      if (!data || data.length === 0) {
        console.warn('Chưa có dữ liệu Zigzag nào trong CSDL!');
        return;
      }

      // Chuyển đổi định dạng timestamp cho TradingView (Unix timestamp in seconds)
      const chartData = data.map(item => ({
        time: Math.floor(new Date(item.time).getTime() / 1000),
        value: item.value
      }));

      // Đưa dữ liệu vào Chart
      lineSeries.setData(chartData);
      
      // Tự động căn chỉnh kích thước khung nhìn
      chart.timeScale().fitContent();
    }
  </script>
</body>
</html>
